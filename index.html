<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Clash - Challenge Your Mind</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sudoku Clash</h1>
            <p class="tagline">Challenge Your Mind</p>
        </header>

        <div class="game-info">
            <div class="info-item">
                <span class="label">Difficulty:</span>
                <span id="current-difficulty" class="value">Medium</span>
            </div>
            <div class="info-item">
                <span class="label">Timer:</span>
                <span id="timer" class="value">00:00</span>
            </div>
            <div class="info-item">
                <span class="label">Mistakes:</span>
                <span id="mistakes" class="value">0/3</span>
            </div>
        </div>

        <div class="game-board-container">
            <div id="sudoku-board" class="sudoku-board"></div>
        </div>

        <div class="number-pad">
            <button class="number-btn" data-number="1">1</button>
            <button class="number-btn" data-number="2">2</button>
            <button class="number-btn" data-number="3">3</button>
            <button class="number-btn" data-number="4">4</button>
            <button class="number-btn" data-number="5">5</button>
            <button class="number-btn" data-number="6">6</button>
            <button class="number-btn" data-number="7">7</button>
            <button class="number-btn" data-number="8">8</button>
            <button class="number-btn" data-number="9">9</button>
            <button class="number-btn erase-btn" data-number="0">Erase</button>
        </div>

        <div class="controls">
            <button id="new-game-btn" class="control-btn primary">New Game</button>
            <button id="hint-btn" class="control-btn">Hint</button>
            <button id="undo-btn" class="control-btn">Undo</button>
            <button id="check-btn" class="control-btn">Check</button>
        </div>

        <div class="difficulty-selector">
            <h3>Select Difficulty</h3>
            <div class="difficulty-buttons">
                <button class="difficulty-btn" data-difficulty="easy">Easy</button>
                <button class="difficulty-btn active" data-difficulty="medium">Medium</button>
                <button class="difficulty-btn" data-difficulty="hard">Hard</button>
                <button class="difficulty-btn" data-difficulty="expert">Expert</button>
            </div>
        </div>
    </div>

    <div id="win-modal" class="modal">
        <div class="modal-content">
            <h2>Congratulations!</h2>
            <p>You completed the puzzle!</p>
            <p>Time: <span id="final-time"></span></p>
            <button id="play-again-btn" class="control-btn primary">Play Again</button>
        </div>
    </div>

    <script src="js/sudoku.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
